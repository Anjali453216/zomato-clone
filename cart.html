<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Your Cart | Zomato Clone</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

.cart-page{
    padding:110px 7% 60px;
    max-width:1000px;
    margin:auto;
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    padding:20px 0;
    border-bottom:1px solid #ddd;
}

.quantity{
    display:flex;
    align-items:center;
    gap:12px;
}

.quantity button{
    width:30px;
    height:30px;
    border:1px solid #ddd;
    background:white;
    cursor:pointer;
    border-radius:5px;
}

.bill{
    margin-top:30px;
    padding:25px;
    background:#fafafa;
    border-radius:12px;
}

.bill-row{
    display:flex;
    justify-content:space-between;
    margin:12px 0;
}

.total{
    font-size:20px;
    font-weight:700;
    border-top:1px solid #ddd;
    padding-top:15px;
}

.empty{
    text-align:center;
    padding:80px 20px;
}

</style>

</head>


<body>

<header class="navbar" style="background:#e23744;position:fixed;">

<a href="index.html" class="brand">zomato</a>

<nav>
<a href="index.html">Home</a>
</nav>

</header>


<main class="cart-page">

<h1>Your Cart</h1>

<div id="cartItems"></div>

<div id="bill"></div>

</main>


<script src="js/cart.js"></script>

</body>

</html>
