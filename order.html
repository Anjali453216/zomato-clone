<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Order Confirmed | Zomato Clone</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

.order-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    text-align:center;
}

.order-box{
    max-width:550px;
    padding:45px 30px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.success{
    font-size:70px;
    margin-bottom:15px;
}

.order-id{
    margin:20px 0;
    padding:15px;
    background:#f5f5f5;
    border-radius:8px;
    font-weight:600;
}

.status{
    display:inline-block;
    padding:8px 15px;
    border-radius:20px;
    background:#e9f7ed;
    color:#24963f;
    font-weight:600;
}

</style>

</head>


<body>

<div class="order-page">

<div class="order-box">

<div class="success">✓</div>

<h1>Order Confirmed!</h1>

<p style="margin-top:10px;color:#777;">
Your food order has been placed successfully.
</p>

<div class="order-id">
Order ID: <span id="orderId"></span>
</div>

<div class="status">
Order Confirmed
</div>

<br><br>

<a href="index.html"
   class="primary-btn"
   style="display:inline-block;text-decoration:none;">
   Continue Exploring
</a>

</div>

</div>


<script>

const orderId =
    localStorage.getItem("orderId") || "ZM000000";

document.getElementById("orderId").innerText =
    orderId;

</script>

</body>

</html>
